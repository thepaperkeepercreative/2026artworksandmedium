<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Craftsman’s Heart</title>
<style>
  :root{--bg:#f3ece4;--fg:#1a0a0e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120508;--fg:#f3ece4}}
  :root[data-theme="dark"]{--bg:#120508;--fg:#f3ece4}
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:Georgia,serif;display:flex;flex-direction:column;align-items:center}
  h1{font-size:1.2rem;font-weight:400;font-style:italic;margin:0 0 12px}
  canvas{max-width:100%;height:auto!important;display:block}
</style>
</head>
<body>
<h1>The Craftsman’s Heart</h1>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script>
/* ======================================================================
   THE CRAFTSMAN'S HEART  v4  -  oil on canvas  (p5.js)

   HOW THE OIL FINISH WORKS (the part that removes the "cartoon" look)
     1. brush() lays thick, mostly opaque dabs: bristle lines whose brightness
        varies, so every dab has ridges.
     2. smear() drags colour across the wet paint like a palette knife
        (wet-on-wet blending), reading and writing p5's pixels[] array.
     3. bake() does the oil-specific finishing on the pixels:
          - luminance becomes a HEIGHT MAP (bright ridge = raised paint)
          - canvas weave + fine craquelure cracks are added to that height
          - slopes are lit from the upper left (impasto highlights/shadows)
          - steep lit slopes get a varnish glint, then a warm amber glaze
     Nothing is drawn as a clean outline any more; forms come from light.

   LAYERS (back to front):  floor -> stencil spray -> vessel labyrinth ->
   shadows + puddle -> burnt wooden mannequin -> [bake] -> heart (own buffer, baked too)
   draw() only: stamps the painting, breathes a glow in the vessels, beats the
   heart (scale only, it never travels) and animates the azure drips.
   ====================================================================== */
const W = 900, H = 900, CX = W/2, CY = H/2;
const HX = 235, HY = 250, HR = -.5;          // heart centre + tilt (apex points toward the figure)
const CAV = [690, 632];                      // hollow chest of the mannequin
const WOUND = [30, 25], WA = -.9;            // stab wound (heart-local position, angle)
const PUD = [305, 484];                      // azure puddle beneath the heart
const DN = Math.atan2(Math.cos(HR), Math.sin(HR));   // "screen down" inside the tilted heart
const CRIMSON = ['#6e0016','#a60b27','#c8142f','#e2263e','#8f0018'];
const PSYCHE  = ['#ff2a6d','#ff9a00','#7b1fa2','#ffd23f'];
const AZURE   = ['#0a8fe0','#0a5fc8','#38b8e8','#1a46d0'];          // azure = the heart's blood only
const PAT     = ['#7b1fa2','#ff2a6d','#ffd23f','#3a8f6a','#ff9a00'];  // scorched acrylic left on the limbs
const LGT = [-.5, -.6, .62];                 // one light: upper left, toward the viewer
const rnd = (a, b) => random(a, b);

let bg, hg, gl, blobs = [], paths = [], drips = [], trunk;
let RAWD, RAWL, CHD, CHL, VD, VL, PURD, PURL, GRD, GRL;

function setup() {
  createCanvas(W, H); pixelDensity(1);
  randomSeed(7); noiseSeed(7);               // same seed = same painting; change to explore
  RAWD = color('#2e1c10'); RAWL = color('#c8955f'); CHD = color('#080605'); CHL = color('#4a4440');
  VD = color('#2a0008'); VL = color('#d4263e'); PURD = color('#1a0618'); PURL = color('#7a3a6a'); GRD = color('#0f1a0c'); GRL = color('#6a8a40');
  bg = createGraphics(W, H); bg.pixelDensity(1);
  buildBlobs();
  paintGround();
  smear(bg, 9000, 26, 4, .45, (x, y) => (noise(x*.006, y*.006) > .5 ? PI/4 : 3*PI/4) + rnd(-.15, .15));   // blend the floor while "wet"
  stencils();
  buildLabyrinth(); paintLabyrinth();
  heartShadow(); puddle(); drawFigure();
  makeGlow();
  bake(bg, true);                            // oil finish for the whole scene
  paintHeart(); bake(hg, false);             // and for the heart's own buffer
}

function draw() {
  const t = frameCount / 60;
  image(bg, 0, 0);
  // lub-dub: two sharp swells per cycle. The heart only SCALES about its centre; it never moves.
  const beat = pow(max(0, sin(t * 3)), 6) + .5 * pow(max(0, sin(t * 3 - .9)), 6), s = 1 + .045 * beat;
  push(); blendMode(ADD); tint(255, 80 * min(1, beat)); image(gl, 0, 0); pop();     // vessels glow warmly on each beat
  push(); translate(HX, HY); rotate(HR); scale(s); image(hg, -150, -260); pop();
  drawDrips(t, s);
}

/* ---------- FISHEYE LENS (bird's-eye depth) ---------- */
// Paint on a flat "source" plane, then bend every point: screen radius = F2 * atan(source radius / FL).
// The 3rd value is the local scale, so strokes shrink toward the edges.
const FL = 520, F2 = 559;
function warp(x, y) {
  const dx = x - CX, dy = y - CY, r = Math.hypot(dx, dy) || 1e-6, rp = F2 * Math.atan(r / FL);
  return [CX + dx / r * rp, CY + dy / r * rp, F2 * FL / (FL * FL + r * r)];
}
function unwarp(x, y) {
  const dx = x - CX, dy = y - CY, rp = Math.hypot(dx, dy) || 1e-6, r = FL * Math.tan(Math.min(rp / F2, 1.45));
  return [CX + dx / rp * r, CY + dy / rp * r];
}

/* ---------- OIL TOOLS ---------- */
// brush(): one dab of oil. n bristle lines, thick and mostly opaque, each pushed toward black or white by
// a random amount. Those brightness differences are what bake() later turns into raised ridges.
function brush(g, x, y, a, len, w, col, al = 220, wp = false) {
  const n = max(2, round(w / 2)), dx = cos(a), dy = sin(a), m = wp ? warp : (px, py) => [px, py, 1];
  g.noFill();
  for (let i = 0; i < n; i++) {
    const o = (i - n/2) * 1.8 + rnd(-.5, .5), l = len * rnd(.8, 1);
    const c = lerpColor(col, color(random() < .5 ? 0 : 255), rnd(0, .28)); c.setAlpha(al * rnd(.7, 1)); g.stroke(c);
    const A = m(x - dy*o, y + dx*o), M = m(x - dy*o + dx*l/2, y + dx*o + dy*l/2), B = m(x - dy*o + dx*l, y + dx*o + dy*l);
    g.strokeWeight(max(.9, 2 * A[2]));
    g.beginShape(); g.vertex(A[0], A[1]); g.vertex(M[0], M[1]); g.vertex(B[0], B[1]); g.endShape();
  }
}
// blotch(): a soft glaze made of stacked, slightly jittered ellipses that shrink inward (no hard edge).
function blotch(g, x, y, rx, ry, col, al, n = 8) {
  g.noStroke();
  for (let i = 0; i < n; i++) {
    const s = 1 - i / n * .6, c = color(col); c.setAlpha(al / n * 1.6); g.fill(c);
    g.ellipse(x + rnd(-1.5, 1.5), y + rnd(-1.5, 1.5), rx * 2 * s * rnd(.85, 1.1), ry * 2 * s * rnd(.85, 1.1));
  }
}
// smear(): palette-knife drag. Picks up the colour under the start point, drags it along a direction,
// mixes it into every pixel it crosses, and slowly absorbs the colours it passes over.
function smear(g, N, len, wid, k, ang) {
  g.loadPixels(); const d = g.pixels;
  for (let i = 0; i < N; i++) {
    let x = rnd(W), y = rnd(H); const a = ang(x, y), c = cos(a), s = sin(a), o0 = 4 * (floor(y) * W + floor(x));
    let r = d[o0], gr = d[o0 + 1], b = d[o0 + 2];
    for (let st = 0; st < len; st++) {
      x += c * 2; y += s * 2; if (x < 0 || x >= W || y < 0 || y >= H) break;
      for (let q = -wid; q <= wid; q++) {
        const px = floor(x - s * q), py = floor(y + c * q); if (px < 0 || px >= W || py < 0 || py >= H) continue;
        const o = 4 * (py * W + px); d[o] += (r - d[o]) * k; d[o+1] += (gr - d[o+1]) * k; d[o+2] += (b - d[o+2]) * k;
      }
      const o = 4 * (floor(y) * W + floor(x)); r += (d[o] - r) * .15; gr += (d[o+1] - gr) * .15; b += (d[o+2] - b) * .15;
    }
  }
  g.updatePixels();
}
// bake(): the oil finish. Steps are numbered in the code.
function bake(g, craq) {
  g.loadPixels(); const w = g.width, h = g.height, n = w * h, Ht = new Float32Array(n);
  for (let i = 0; i < n; i++) Ht[i] = (.3 * g.pixels[4*i] + .59 * g.pixels[4*i+1] + .11 * g.pixels[4*i+2]) * g.pixels[4*i+3] / 255;   // 1. luminance = height
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) Ht[y*w + x] += 6 * Math.sin(x * 1.57) * Math.sin(y * 1.57);               // 2. canvas weave
  if (craq) for (let k = 0; k < 70; k++) {                                                                                         //    craquelure: random wandering grooves
    let x = rnd(w), y = rnd(h), a = rnd(TWO_PI);
    for (let s = 0; s < 70; s++) { a += rnd(-.5, .5); x += cos(a); y += sin(a); const o = floor(y) * w + floor(x); if (o > 0 && o < n) Ht[o] -= 22; }
  }
  g.filter(BLUR, 1); g.loadPixels(); const e = g.pixels;                                                                           // 3. soften the colour (edges melt), keep the sharp height
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x; if (e[4*i+3] < 8) continue;
    const sh = ((Ht[i+1] - Ht[i-1]) * .25 + (Ht[i+w] - Ht[i-w]) * .3) * .012;                                                       // 4. slope toward the light (matches LGT)
    const f = 1 + constrain(sh, -.45, .45), sp = max(0, sh - .18) * 220;                                                            // 5. varnish glint on steep lit slopes
    e[4*i] = constrain(e[4*i] * f * 1.04 + sp, 0, 255); e[4*i+1] = constrain(e[4*i+1] * f * .99 + sp * .95, 0, 255); e[4*i+2] = constrain(e[4*i+2] * f * .92 + sp * .85, 0, 255);   // 6. amber glaze
  }
  g.updatePixels();
}

// strand(): oil-painted tube along a polyline. Bristles run along its length; each bristle's light
// level is (surface normal across the tube) . light, so it reads round. Used by vessels and wood.
function strand(g, pts, ws, pal, jit = 1.2) {
  const n = pts.length, nr = pts.map((p, i) => {
    const a = pts[max(i - 1, 0)], b = pts[min(i + 1, n - 1)], dx = b[0] - a[0], dy = b[1] - a[1], l = Math.hypot(dx, dy) || 1;
    return [-dy / l, dx / l];
  });
  const nb = max(2, ceil(max(...ws) / 2.2)); g.noFill();
  for (let i = 0; i < nb; i++) {
    const f = i / (nb - 1) * 2 - 1, z = Math.sqrt(1 - f * f);
    for (let k = 0; k < n - 1; k++) {
      const o0 = f * ws[k]/2 + (noise(i*.7, k*.3) - .5) * jit, o1 = f * ws[k+1]/2 + (noise(i*.7, (k+1)*.3) - .5) * jit;
      const s = constrain(.16 + .84 * max(0, f * (nr[k][0]*LGT[0] + nr[k][1]*LGT[1]) + z * LGT[2]), 0, 1);
      g.stroke(pal(s, pts[k][0], pts[k][1])); g.strokeWeight(max(1.2, ws[k] / (nb - 1) * 1.5));
      g.line(pts[k][0] + nr[k][0]*o0, pts[k][1] + nr[k][1]*o0, pts[k+1][0] + nr[k+1][0]*o1, pts[k+1][1] + nr[k+1][1]*o1);
    }
  }
}

/* ---------- 1. FLOOR ---------- */
function paintGround() {
  bg.background('#3a000a');
  // Three passes: big loose strokes first, small ones last, like real underpainting -> detail.
  [[5200, 150, 18], [7000, 90, 12], [10000, 45, 7]].forEach(([N, len, wd], L) => {
    for (let i = 0; i < N; i++) {
      const sx = rnd(-30, W + 30), sy = rnd(-30, H + 30), [x, y] = unwarp(sx, sy), k = pow(1 / warp(x, y)[2], .6);
      const light = noise(sx*.004 + L*7, sy*.004), edge = constrain(pow(dist(sx, sy, CX, CY) / 636, 2) * .7, 0, .7);   // edges sink into shadow
      const col = lerpColor(lerpColor(color('#3a0008'), color(random(CRIMSON)), constrain(light * 1.5, 0, 1)), color('#12000a'), edge);
      brush(bg, x, y, (random() < .5 ? PI/4 : 3*PI/4) + rnd(-.08, .08), len * k * rnd(.6, 1), wd * k, col, 230, true);
    }
  });
  bg.noFill(); bg.stroke(0, 0, 0, 80); bg.strokeWeight(2.5);               // diagonal tile seams, bent by the lens
  for (const s of [1, -1]) for (let c = -1800; c < 1800; c += 90) {
    bg.beginShape();
    for (let x = -800; x <= 1700; x += 40) { const p = warp(x, (s > 0 ? x + c : c - x) + (noise(x*.02, c) - .5) * 8); bg.vertex(p[0], p[1]); }
    bg.endShape();
  }
}

/* ---------- 2. STENCIL SPRAY ---------- */
function ring(sx, sy, R, n, cols, al) {                                    // dots kept only where the diamond-ring maths allows
  const [cx, cy] = unwarp(sx, sy);
  for (let i = 0; i < R * R * .28; i++) {
    const dx = rnd(-R, R), dy = rnd(-R, R), m = (abs(dx) + abs(dy)) / R;
    if (m > 1) continue;
    const k = floor(m * n); if (k % 2) continue;
    const q = warp(cx + dx, cy + dy), c = color(cols[k % cols.length]); c.setAlpha(al * rnd(.5, 1));
    bg.stroke(c); bg.strokeWeight(max(1, 2.6 * q[2])); bg.point(q[0], q[1]);
  }
}
function stencils() {
  ring(HX, HY + 20, 330, 7, PSYCHE, 120); ring(700, 740, 300, 6, PSYCHE, 110);
  for (let i = 0; i < 10; i++) ring(rnd(60, W - 60), rnd(60, H - 60), rnd(50, 100), 4, PSYCHE, 90);
}

/* ---------- 3. LABYRINTH ---------- */
// grow(): noise-steered walker that tapers and forks (see v3). Lives on the flat source plane.
function grow(out, pre, pw, x, y, a, n, w, d, o) {
  const pts = pre.slice(), ws = pw.slice();
  if (!pts.length) { pts.push([x, y]); ws.push(w); }
  const from = pts.length - 1;
  for (let i = 0; i < n; i++) {
    a += (noise(x*.006 + d*9, y*.006) - .5) * o.wob + rnd(-.12, .12);
    if (o.tg) { const da = atan2(o.tg[1] - y, o.tg[0] - x) - a; a += atan2(sin(da), cos(da)) * .12; }
    x += cos(a) * o.st; y += sin(a) * o.st;
    const wi = w * (1 - i / n * .55); pts.push([x, y]); ws.push(wi);
    if (o.tg && dist(x, y, o.tg[0], o.tg[1]) < 10) break;
    if (!o.lim(x, y)) break;
    if (d < 4 && random() < o.pb) grow(out, pts, ws, x, y, a + random([-1, 1]) * rnd(.5, 1.1), floor(n * rnd(.45, .7)), wi * .62, d + 1, { ...o, tg: null });
  }
  out.push({ pts, ws, from, d });
}
function buildLabyrinth() {
  const lim = (x, y) => { const p = warp(x, y); return p[0] > -60 && p[0] < W + 60 && p[1] > -60 && p[1] < H + 60; };
  const tips = [[95, -120, 70], [-85, -195, 60], [-100, -230, 50]].map(([x, y, w]) => [...unwarp(...toWorld(x, y)), w]);   // tips of aorta / pulmonary artery / vena cava
  const cav = unwarp(...CAV);
  grow(paths, [], [], tips[0][0], tips[0][1], atan2(cav[1] - tips[0][1], cav[0] - tips[0][0]), 120, tips[0][2], 0, { st: 9, wob: 1.4, pb: .06, lim, tg: cav });
  trunk = paths[paths.length - 1];
  [[0, 3], [1, 4], [2, 4]].forEach(([ti, n]) => { for (let i = 0; i < n; i++) grow(paths, [], [], tips[ti][0], tips[ti][1], rnd(TWO_PI), 70, tips[ti][2] * .8, 0, { st: 11, wob: 2.6, pb: .065, lim }); });
  paths.forEach(P => {
    P.sp = []; P.sw = [];
    P.pts.forEach(q => { const w = warp(...q); P.sp.push([w[0], w[1]]); P.sw.push(P.ws[P.sp.length - 1] * w[2]); });   // screen position + perspective width
  });
}
const vesPal = (s, x, y) => lerpColor(VD, VL, constrain(s * .85 + (noise(x*.05, y*.05) - .5) * .3, 0, 1));
function paintLabyrinth() {
  const L = paths.slice().sort((a, b) => b.ws[b.from] - a.ws[a.from]);       // thick trunks first, thin branches on top
  bg.noFill(); bg.stroke(0, 0, 0, 26);
  for (const P of L) for (let i = P.from; i < P.sp.length - 1; i++) { bg.strokeWeight(P.sw[i] + 8); bg.line(P.sp[i][0] + 10, P.sp[i][1] + 14, P.sp[i+1][0] + 10, P.sp[i+1][1] + 14); }
  for (const P of L) strand(bg, P.sp.slice(P.from), P.sw.slice(P.from), vesPal, 1.6);
}
// Separate glow layer: the same vessels in hot red, blurred, with the mannequin erased from it.
function makeGlow() {
  gl = createGraphics(W, H); gl.pixelDensity(1);
  const gp = (s) => lerpColor(color('#300000'), color('#ff6a50'), s);
  for (const P of paths) strand(gl, P.sp.slice(P.from), P.sw.slice(P.from), gp, 1.6);
  gl.erase(); figure(gl, 255); gl.noErase(); gl.filter(BLUR, 2);
}

/* ---------- 4. BURNT WOODEN MANNEQUIN ---------- */
// Wood = raw wood vs char, mixed by Perlin noise so it burns in patches. `s` is the light level.
const woodPal = (s, x, y) => lerpColor(lerpColor(RAWD, RAWL, s), lerpColor(CHD, CHL, s), constrain(noise(x*.035, y*.035) * 1.8 - .1, 0, 1));
const jointPal = (s, x, y) => lerpColor(woodPal(s, x, y), lerpColor(GRD, GRL, s), .35);      // scorched verdigris joints
const chestPal = (s, x, y) => lerpColor(woodPal(s, x, y), lerpColor(PURD, PURL, s), .3);     // violet lacquer left on the chest

function pattern(g, a, b, w0, w1) {                                                // acrylic diamonds/squares as small oil dabs, then soot
  const L = dist(...a, ...b), ux = (b[0]-a[0])/L, uy = (b[1]-a[1])/L, nx = -uy, ny = ux;
  for (let i = 0, n = L * (w0 + w1) / 130 + 3; i < n; i++) {
    const t = rnd(.08, .92), f = rnd(-.7, .7), w = lerp(w0, w1, t) / 2, z = sqrt(1 - f*f);
    const sh = .25 + .75 * max(0, f * (nx*LGT[0] + ny*LGT[1]) + z * LGT[2]);
    brush(g, a[0] + ux*L*t + nx*f*w, a[1] + uy*L*t + ny*f*w, atan2(uy, ux) + (random() < .5 ? PI/4 : 0), rnd(3, 6), rnd(3, 5), lerpColor(color(0), color(random(PAT)), sh), rnd(150, 230));
  }
  for (let i = 0; i < L * (w0 + w1) / 50; i++) {
    const t = rnd(.05, .95), w = lerp(w0, w1, t) / 2, f = rnd(-.8, .8);
    g.noStroke(); g.fill(0, 0, 0, rnd(30, 70)); g.ellipse(a[0] + ux*L*t + nx*f*w, a[1] + uy*L*t + ny*f*w, rnd(3, 9), rnd(3, 9));
  }
}
function wood(g, a, b, w0, w1, o = {}) {
  if (o.sh) { g.stroke(0, 0, 0, o.sh); g.strokeWeight((w0 + w1) / 2); g.line(...a, ...b); return; }
  const L = dist(...a, ...b), ux = (b[0]-a[0])/L, uy = (b[1]-a[1])/L, nx = -uy, ny = ux, pts = [], ws = [];
  for (let k = 0; k <= 8; k++) { const t = k / 8; pts.push([a[0] + (b[0]-a[0])*t, a[1] + (b[1]-a[1])*t]); ws.push(lerp(w0, w1, t)); }
  strand(g, pts, ws, o.pal || woodPal);
  g.strokeWeight(1);
  for (let k = 0; k < L * (w0 + w1) / 60; k++) {                                   // dry-brush flecks: black, ash, raw wood
    const t = rnd(.02, .95), w = lerp(w0, w1, t) / 2, f = rnd(-.9, .9), x = a[0] + ux*L*t + nx*f*w, y = a[1] + uy*L*t + ny*f*w;
    const c = color(random(['#000000', '#7a6552', '#d0a070'])); c.setAlpha(rnd(40, 100)); g.stroke(c); g.line(x, y, x + ux*rnd(4, 12), y + uy*rnd(4, 12));
  }
  if (o.pat) pattern(g, a, b, w0, w1);
  for (let k = 0; k < L / 14; k++) {                                               // charred cracks with raw wood showing in the gap
    const t = rnd(.05, .95), w = lerp(w0, w1, t) / 2, x = a[0] + ux*L*t, y = a[1] + uy*L*t, v = [];
    for (let j = -1; j <= 1; j += .5) v.push([x + nx*w*j + ux*rnd(-3, 3), y + ny*w*j + uy*rnd(-3, 3)]);
    g.noFill(); g.stroke(0, 0, 0, 220); g.strokeWeight(1.6); g.beginShape(); v.forEach(p => g.vertex(...p)); g.endShape();
    g.stroke(200, 150, 90, 80); g.strokeWeight(.8); g.beginShape(); v.forEach(p => g.vertex(p[0] + 1, p[1] + 1)); g.endShape();
    if (random() < .35) { g.stroke(255, 110, 10, 200); g.strokeWeight(1.2); g.line(x, y, x + nx*w*.6 + ux*2, y + ny*w*.6); }
  }
}
function ball(g, x, y, rx, ry, rot, o = {}) {                                      // ellipsoid with true sphere shading
  g.push(); g.translate(x, y); g.rotate(rot);
  if (o.sh) { g.noStroke(); g.fill(0, 0, 0, o.sh); g.ellipse(0, 0, rx*2, ry*2); g.pop(); return; }
  const c = Math.cos(rot), sn = Math.sin(rot), lx = LGT[0]*c + LGT[1]*sn, ly = -LGT[0]*sn + LGT[1]*c, pal = o.pal || woodPal;
  g.noFill(); g.strokeWeight(2.4);
  for (let k = -rx + .5; k < rx; k += 2) {
    const f = k / rx, span = Math.sqrt(1 - f*f);
    for (let j = 0; j < 8; j++) {
      const v0 = -span + 2*span*j/8, v1 = -span + 2*span*(j+1)/8, vm = (v0 + v1) / 2, nz = Math.sqrt(Math.max(0, 1 - f*f - vm*vm));
      g.stroke(pal(constrain(.14 + .86 * Math.max(0, f*lx + vm*ly + nz*LGT[2]), 0, 1), x + k, y + vm*ry)); g.line(k, v0*ry, k, v1*ry);
    }
  }
  g.pop();
}
// Articulated artist's mannequin: egg head, ovoid chest, barrel abdomen, ball joints, spade hands + feet.
function figure(g, sh) {
  const Wd = (a, b, w0, w1, o = {}) => wood(g, a, b, w0, w1, { ...o, sh }), B = (x, y, rx, ry, rot, o = {}) => ball(g, x, y, rx, ry, rot, { ...o, sh }), J = { pal: jointPal };
  [[662,742,655,812,650,874,634,895,-1], [716,742,722,812,728,874,744,895,1]].forEach(([hx, hy, kx, ky, ax, ay, fx, fy, d]) => {   // legs
    Wd([hx, hy], [kx, ky], 26, 20, { pat: 1 }); B(kx, ky + 4, 11, 11, 0, J);
    Wd([kx, ky + 4], [ax, ay], 20, 14, { pat: 1 }); B(ax, ay + 2, 7, 7, 0, J);
    Wd([ax, ay + 3], [fx, fy], 9, 20); B(fx, fy, 10, 5, d * .7);
  });
  B(689, 738, 38, 20, 0); B(662, 742, 12, 12, 0, J); B(716, 742, 12, 12, 0, J);   // pelvis + hips
  Wd([690, 684], [689, 724], 46, 42, { pat: 1 });                                  // abdomen
  B(692, 622, 44, 60, .03, { pal: chestPal });                                      // chest
  Wd([700, 548], [696, 566], 10, 12); B(696, 568, 9, 9, 0, J);                      // neck
  [[648,590,634,662,633,666,640,738,641,741,644,783], [738,598,752,668,753,672,746,744,746,747,744,787]].forEach(([sx, sy, ex, ey, ex2, ey2, wx, wy, wx2, wy2, hx, hy]) => {   // arms hang limp
    B(sx, sy, 13, 13, 0, J); Wd([sx, sy], [ex, ey], 21, 18);
    B(ex2, ey2, 10, 10, 0, J); Wd([ex2, ey2], [wx, wy], 18, 13, { pat: 1 });
    B(wx2, wy2, 7, 7, 0, J); Wd([wx2, wy2 + 2], [hx, hy], 9, 19); B(hx, hy + 1, 9, 5, 0);
  });
  B(706, 510, 28, 40, .3);                                                          // head, bowed
}
function face(g) {                                    // dead face: soft glazes and dabs, no outlines
  g.push(); g.translate(706, 512); g.rotate(.3);
  [-1, 1].forEach(s => { blotch(g, s*11, -6, 9, 12, '#000000', 230, 9); blotch(g, s*17, 12, 6, 11, '#000000', 90, 6); });   // hollow sockets, sunken cheeks
  g.noStroke(); g.fill(255, 110, 10, 130); [-1, 1].forEach(s => g.ellipse(s*11, -4, 2.5, 2.5));                                // dying embers
  blotch(g, 0, 9, 4, 7, '#000000', 220, 5);                                                                                   // nose slit
  for (let i = 0; i < 16; i++) brush(g, -14 + i*1.8, 27 + rnd(-3, 4), 0, 6, 5, color('#050000'), 235);                       // open mouth
  for (let i = 1; i < 8; i++) brush(g, -14 + i*3.5, 24, PI/2, 7, 2, color('#b09a78'), 170);                                    // teeth / stitches
  g.stroke(0, 0, 0, 220); g.strokeWeight(1.6); g.noFill(); g.beginShape(); [[-8,-34],[-3,-26],[-7,-18],[2,-10]].forEach(p => g.vertex(...p)); g.endShape();   // forehead crack
  g.pop();
}
function drawFigure() {
  for (let k = 6; k >= 1; k--) { bg.push(); bg.translate(k * 10, k * 12); figure(bg, 16); bg.pop(); }   // long soft diagonal shadow
  figure(bg, 0); face(bg);
  blotch(bg, CAV[0], CAV[1], 23, 36, '#060002', 230, 10); blotch(bg, CAV[0], CAV[1], 10, 17, '#46000c', 150, 6);   // hollow chest
  for (let i = 0; i < 70; i++) {                                                    // splintered rim
    const th = rnd(TWO_PI), x = CAV[0] + cos(th) * 23, y = CAV[1] + sin(th) * 36, c = color(random(['#c8955f', '#6b4a2e', '#2a1a10'])); c.setAlpha(190);
    bg.stroke(c); bg.strokeWeight(1.6); bg.line(x, y, x + cos(th + rnd(-.3, .3)) * rnd(3, 8), y + sin(th + rnd(-.3, .3)) * rnd(3, 8));
  }
  [-22, 0, 22].forEach(dy => { const p = []; for (let j = 0; j <= 8; j++) p.push([CAV[0] - 20 + 40 * j / 8, CAV[1] + dy + 6 * sin(PI * j / 8)]); strand(bg, p, Array(9).fill(6), woodPal); });   // ribs
  const n = 14; strand(bg, trunk.sp.slice(-n), trunk.sw.slice(-n), vesPal, 1.6);    // the artery plugs into the empty chest
}

/* ---------- 5. HEART ---------- */
// Domes (chambers + great vessels) -> field() height -> slope -> light -> colour. Strokes wrap around the domes.
function tube(p0, p1, p2, p3, r0, r1, h, n) {
  for (let i = 0; i <= n; i++) {
    const t = i / n, u = 1 - t, r = lerp(r0, r1, t);
    blobs.push({ x: u**3*p0[0] + 3*u*u*t*p1[0] + 3*u*t*t*p2[0] + t**3*p3[0], y: u**3*p0[1] + 3*u*u*t*p1[1] + 3*u*t*t*p2[1] + t**3*p3[1], rx: r, ry: r, r: 0, h });
  }
}
function buildBlobs() {
  blobs.push({ x: 35, y: 35, rx: 92, ry: 128, r: .12, h: 1 });       // left ventricle
  blobs.push({ x: -48, y: 30, rx: 70, ry: 100, r: -.15, h: .85 });   // right ventricle
  blobs.push({ x: -85, y: -55, rx: 48, ry: 62, r: .2, h: .7 });      // right atrium
  blobs.push({ x: 70, y: -70, rx: 42, ry: 40, r: 0, h: .55 });       // left atrium
  blobs.push({ x: -40, y: -95, rx: 34, ry: 22, r: -.5, h: .75 });    // auricle
  tube([10,-70], [5,-130], [50,-170], [95,-120], 24, 22, .95, 14);               // aorta
  tube([-15,-65], [-35,-130], [-70,-160], [-85,-195], 20, 17, .85, 12);          // pulmonary artery
  tube([-88,-90], [-92,-150], [-95,-190], [-100,-230], 16, 16, .8, 10);          // vena cava
}
function field(x, y) {
  let best = 0;
  for (const b of blobs) {
    const c = Math.cos(b.r), s = Math.sin(b.r), dx = x - b.x, dy = y - b.y, u = (dx*c + dy*s) / b.rx, v = (-dx*s + dy*c) / b.ry, d = u*u + v*v;
    if (d < 1) best = Math.max(best, b.h * Math.sqrt(1 - d));
  }
  return best;
}
const toWorld = (x, y) => [HX + x*cos(HR) - y*sin(HR), HY + x*sin(HR) + y*cos(HR)];

function paintHeart() {
  hg = createGraphics(320, 440); hg.pixelDensity(1); hg.translate(150, 260);      // local (0,0) = heart centre
  const c0 = color('#2b0007'), c1 = color('#a3141f'), c2 = color('#ff6a55'), N = 12000;
  for (let i = 0; i < N; i++) {
    const x = rnd(-125, 130), y = rnd(-250, 165), h = field(x, y); if (h < .02) continue;
    const e = 3, gx = (field(x+e, y) - field(x-e, y)) / (2*e) * 70, gy = (field(x, y+e) - field(x, y-e)) / (2*e) * 70, norm = sqrt(gx*gx + gy*gy + 1);
    let s = constrain(((.5*gx + .6*gy + .65) / norm) * 1.1 + rnd(-.08, .08) + (noise(x*.05, y*.05) - .5) * .3, 0, 1);
    if (norm > 2.5) s *= .5;                                                       // steep = crease = dark groove
    const col = s < .7 ? lerpColor(c0, c1, s / .7) : lerpColor(c1, c2, (s - .7) / .3 * .7);
    const a = norm > 1.02 ? atan2(gx, -gy) + (noise(x*.03, y*.03) - .5) * .8 : rnd(TWO_PI), f = i / N;   // strokes follow the surface
    brush(hg, x, y, a, lerp(26, 10, f) * constrain(h * 3, .4, 1), lerp(10, 4, f), col, 225);
  }
  // THE STAB: torn raised lips, a dark opening, azure welling out. No weapon, only the wound.
  const [wx, wy] = WOUND, ca = cos(WA), sa = sin(WA);
  for (let i = 0; i < 130; i++) {
    const u = rnd(-22, 22), side = random() < .5 ? -1 : 1, off = side * rnd(3, 7);
    brush(hg, wx + ca*u - sa*off, wy + sa*u + ca*off, WA + rnd(-.2, .2), rnd(8, 16), rnd(3, 5), color(random(['#5a0a12', '#e0685c', '#7a1018'])), 230);
  }
  hg.push(); hg.translate(wx, wy); hg.rotate(WA); blotch(hg, 0, 0, 25, 6, '#050008', 240, 7); hg.pop();
  for (let i = 0; i < 40; i++) { const u = rnd(-18, 18); brush(hg, wx + ca*u, wy + sa*u, DN + rnd(-.5, .5), rnd(10, 28), rnd(3, 6), color(random(AZURE)), 235); }
  // Rivulets run "down" (screen terms) until they leave the heart; where they leave, a drip is born.
  for (let k = 0; k < 7; k++) {
    const u = rnd(-22, 22); let px = wx + ca*u, py = wy + sa*u + 4; const ph = rnd(10);
    for (let st = 0; st < 120; st++) {
      px += cos(DN) * 3 + (noise(ph, st*.15) - .5) * 3 * -sin(DN); py += sin(DN) * 3 + (noise(ph, st*.15) - .5) * 3 * cos(DN);
      brush(hg, px, py, DN, 5, max(3, 6 - st*.03), color('#0a6fd0'), 235); brush(hg, px - 1, py - 1, DN, 4, 2, color('#9fe0f5'), 130);
      if (st > 6 && field(px, py) < .03) { const w = toWorld(px, py); drips.push({ x: w[0], y: w[1] }); break; }
    }
  }
  drips.forEach(d => { d.per = rnd(6, 10); d.ph = rnd(12); d.hang = rnd(1.4, 2.4); d.fall = .8; d.land = PUD[1] + rnd(-10, 10); });
}
function heartShadow() {                              // soft shadow: many faint offset dots inside the silhouette
  bg.noStroke();
  for (let i = 0; i < 1400; i++) {
    const x = rnd(-125, 130), y = rnd(-250, 165); if (field(x, y) < .03) continue;
    const [wx, wy] = toWorld(x, y); bg.fill(0, 0, 0, 8); bg.ellipse(wx + 70, wy + 80, 34, 34);
  }
}

/* ---------- 6. PUDDLE + DRIPS ---------- */
function puddle() {                                   // glossy azure pool: flat strokes, dark depth at the rim, pale gloss
  const [px, py] = PUD, rx = 145, ry = 40;
  blotch(bg, px + 10, py + 8, rx + 30, ry + 12, '#001a40', 150, 9);
  for (let i = 0; i < 900; i++) {
    const th = rnd(TWO_PI), r = sqrt(random()), e = 1 + .12 * sin(th * 5);        // wobbly, irregular edge
    brush(bg, px + cos(th) * r * rx * e, py + sin(th) * r * ry * e, rnd(-.2, .2), rnd(20, 50), rnd(5, 9), color(random(AZURE)), 230);
  }
  for (let i = 0; i < 120; i++) { const th = rnd(TWO_PI); brush(bg, px + cos(th) * rx, py + sin(th) * ry, th + PI/2, 10, 4, color('#0a1f5c'), 190); }
  for (let i = 0; i < 60; i++) brush(bg, px + rnd(-rx * .7, rx * .3), py - ry * rnd(.1, .6), rnd(-.1, .1), rnd(14, 40), 3, color('#bff0ff'), 140);
}
// A glossy bead: a radial gradient (drawingContext) gives a wet, rounded highlight with no outline.
function bead(x, y, r, st, al) {
  const c = drawingContext, g = c.createRadialGradient(x - r*.35, y - r*.4*st, r*.1, x, y, r*1.1);
  g.addColorStop(0, `rgba(220,248,255,${al})`); g.addColorStop(.3, `rgba(30,150,235,${al})`);
  g.addColorStop(.8, `rgba(8,70,190,${al})`); g.addColorStop(1, `rgba(2,25,80,${al * .9})`);
  c.fillStyle = g; c.beginPath(); c.ellipse(x, y, r, r * st, 0, 0, TWO_PI); c.fill();
}
function drawDrips(t, s) {
  for (const d of drips) {
    const u = (t + d.ph) % d.per;
    if (u < d.hang) { const k = u / d.hang; bead(HX + (d.x - HX) * s, HY + (d.y - HY) * s + 3 * k, lerp(2.5, 7, k), 1 + k * .7, .95); }   // hangs and swells
    else if (u < d.hang + d.fall) {                                                                                                  // falls, accelerating
      const k = (u - d.hang) / d.fall, y = d.y + (d.land - d.y) * k * k;
      stroke(10, 120, 220, 90); strokeWeight(3); line(d.x, y - 26 * k, d.x, y); bead(d.x, y, 5, 1.5, .95);
    } else if (u < d.hang + d.fall + 1.8) {                                                                                          // lands: ripples fade out
      const k = (u - d.hang - d.fall) / 1.8; noFill(); stroke(150, 220, 255, 170 * (1 - k)); strokeWeight(1.5);
      ellipse(d.x, d.land, k * 90, k * 30); ellipse(d.x, d.land, k * 50, k * 17);
    }
  }
}
